<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Live Connection Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 16px;
      width: 300px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .status {
      font-size: 14px;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-block;
    }
    .connected { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
    .error { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .switch-container {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 10px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(24px); }
  </style>
</head>
<body>

  <div class="card">
    <h2>Server Link Test</h2>
    <div id="connection-status" class="status">Connecting to Supabase...</div>
    
    <div class="switch-container">
      <span>Server Switch</span>
      <label class="switch">
        <input type="checkbox" id="serverSwitch" onchange="toggleServerState(this)">
        <span class="slider"></span>
      </label>
    </div>
    <p id="feedback" style="font-size: 12px; color: #94a3b8; margin-top: 12px;"></p>
  </div>

  <script>
    const SUPABASE_URL = 'https://lrwpwexwmexgnwlsgnpk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fBPEp581Pagpy3U4RnynGA_eHoc22tk';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const statusEl = document.getElementById('connection-status');
    const serverSwitch = document.getElementById('serverSwitch');
    const feedbackEl = document.getElementById('feedback');

    async function fetchInitialState() {
      try {
        const { data, error } = await supabase
          .from('app_status')
          .select('switch_state')
          .limit(1)
          .single();

        if (error) throw error;

        serverSwitch.checked = data.switch_state;
        statusEl.textContent = "Connected to Supabase Live";
        statusEl.className = "status connected";
        feedbackEl.textContent = "Synced successfully with cloud.";
      } catch (err) {
        statusEl.textContent = "Connection Failed";
        statusEl.className = "status error";
        feedbackEl.textContent = err.message;
      }
    }

    async function toggleServerState(checkbox) {
      const newState = checkbox.checked;
      feedbackEl.textContent = "Updating server...";
      
      const { error } = await supabase
        .from('app_status')
        .update({ switch_state: newState })
        .eq('id', 1);

      if (error) {
        feedbackEl.textContent = "Update failed: " + error.message;
        checkbox.checked = !newState;
      } else {
        feedbackEl.textContent = `Server updated! State: ${newState}`;
      }
    }

    fetchInitialState();
  </script>
</body>
</html>
